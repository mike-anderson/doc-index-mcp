version: 2
updates:
  # Python dependencies: pyproject.toml constraints and uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch routine bumps into one PR; majors still get their own PR so
      # breaking changes (like mcp 1.x -> 2.x) are reviewed individually.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
