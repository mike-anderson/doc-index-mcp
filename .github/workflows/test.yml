name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest src/tests/ -v

  # The job above installs via `uv sync`, which pins every dependency from
  # uv.lock. That means it cannot catch a too-loose constraint in
  # pyproject.toml: v0.1.0 shipped `mcp>=1.0.0`, resolved fine against the
  # lock in CI, and then crashed on import for every `uvx doc-index-mcp` user
  # once mcp 2.0 removed the decorator API. This job installs the built wheel
  # with a fresh, unlocked resolve — the way uvx and pip actually install it —
  # and confirms the server still starts and registers its tools.
  smoke-install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheel
        run: uv build

      - name: Install wheel without the lockfile
        run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python dist/*.whl

      - name: Report resolved dependency versions
        run: uv pip list --python .smoke/bin/python

      - name: Server starts and lists its tools
        run: .smoke/bin/python scripts/smoke_stdio.py .smoke/bin/doc-index-mcp
