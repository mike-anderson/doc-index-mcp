[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-index-mcp"
version = "0.3.0"
description = "MCP server for semantic document search with boundary-aware chunking"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["mcp", "semantic-search", "document-indexing", "rag", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # 2.x: src/server.py registers handlers via Server(on_list_tools=...,
    # on_call_tool=...), which replaced the 1.x decorator API. Capped below
    # the next major so a future breaking release can't reach uvx users.
    "mcp>=2.0.0,<3",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    # Embedding - ONNX-based, lightweight (~50x smaller than PyTorch)
    "fastembed>=0.2.0",
    # Vector search - pre-built wheels, no C++ compilation
    "usearch>=2.0.0",
    # Token counting
    "tiktoken>=0.5.0",
    # Document loading
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/mike-anderson/doc-index-mcp"
Repository = "https://github.com/mike-anderson/doc-index-mcp"
Issues = "https://github.com/mike-anderson/doc-index-mcp/issues"

[project.optional-dependencies]
cuda = [
    "onnxruntime-gpu>=1.17.0",
]
apple = [
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
doc-index-mcp = "src.server:main"
doc-index-install-skill = "src.install_skill:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
artifacts = ["src/skills/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/tests", "tests"]
